<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DLS Check</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <link rel="icon" type="image/jpeg" href="icon.jpg">
  <link rel="apple-touch-icon" href="icon.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans pb-10">

  <!-- Header -->
  <header class="p-4 bg-zinc-900 border-b border-zinc-800 sticky top-0 z-10 shadow-lg space-y-3">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-2.5">
        <img src="icon.jpg" alt="Logo DLS" class="w-8 h-8 rounded-full border border-zinc-700 object-cover">
        <h1 class="text-lg font-bold text-red-500">DLS Check</h1>
      </div>
      <div class="flex gap-2">
        <button id="btn-config" class="px-3 py-1 text-xs bg-zinc-800 hover:bg-zinc-700 rounded text-zinc-300">Config API</button>
        <button id="btn-sync" class="px-3 py-1 text-xs bg-red-600 hover:bg-red-500 rounded font-semibold">Atualizar</button>
      </div>
    </div>

    <!-- Filtros de Status -->
    <div class="flex gap-1.5 text-xs overflow-x-auto pb-1 no-scrollbar">
      <button data-filter="all" class="filter-btn px-3 py-1 rounded-full bg-red-600 text-white font-medium flex-shrink-0">Todos</button>
      <button data-filter="watching" class="filter-btn px-3 py-1 rounded-full bg-zinc-800 text-zinc-400 font-medium flex-shrink-0">⏳ Assistindo</button>
      <button data-filter="unstarted" class="filter-btn px-3 py-1 rounded-full bg-zinc-800 text-zinc-400 font-medium flex-shrink-0">○ Não Iniciados</button>
      <button data-filter="completed" class="filter-btn px-3 py-1 rounded-full bg-zinc-800 text-zinc-400 font-medium flex-shrink-0">✓ Concluídos</button>
    </div>
  </header>

  <!-- Feed de Episódios -->
  <main class="max-w-md mx-auto p-4 space-y-4">
    <div id="stats" class="text-xs text-zinc-400 text-center py-1 bg-zinc-900/50 rounded-lg border border-zinc-800">
      Carregando progresso...
    </div>

    <div id="feed" class="space-y-3">
      <!-- Cards renderizados dinamicamente -->
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW erro:', err));
    }
  </script>
</body>
</html>
